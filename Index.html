<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Haverfordwest Local Store Finder</title>
  <meta name="description" content="Type what you want to buy — we show you local stores in Haverfordwest area." />
  <style>
    :root {
      --bg: #f4f6fd;
      --card: #ffffff;
      --accent: #0055a5; /* Haverfordwest-style blue */
      --muted: #555;
      --radius: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,50,0.08);
      padding: 24px;
      text-align: center;
    }
    img.logo {
      max-width: 120px;
      height: auto;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px 0;
      color: var(--accent);
      font-size: 24px;
    }
    p.lead {
      margin: 0 0 20px 0;
      color: var(--muted);
      font-size: 16px;
    }
    form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="search"] {
      flex: 1 1 auto;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      font-size: 16px;
      min-width: 160px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0c14;
        --card: #11161f;
        --accent: #1e6de5;
        --muted: #9aa6bd;
      }
      body { background: var(--bg); }
      .container { box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Haverfordwest logo — update URL if you host locally or choose another version -->
    <img class="logo" src="https://logoneate.com/haverfordwest-county/logo.png" alt="Haverfordwest logo" />
    <h1>Find a Local Store</h1>
    <p class="lead">Type what you want to buy — we’ll show nearby stores around Haverfordwest.</p>

    <form id="searchForm">
      <input id="query" type="search" placeholder='e.g. "batteries", "pet food", "printer toner"' required />
      <button type="submit" id="go">Search</button>
    </form>

    <div class="status" id="status" aria-live="polite" style="display:none;"></div>
  </div>

  <script>
    (function(){
      const form = document.getElementById('searchForm');
      const q = document.getElementById('query');
      const status = document.getElementById('status');
      const btn = document.getElementById('go');
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      function showStatus(msg, busy=false) {
        status.style.display = msg ? 'block' : 'none';
        status.textContent = msg;
        if (busy) {
          if (!document.getElementById('sp')) {
            const s = document.createElement('span');
            s.id = 'sp';
            s.className = 'spinner';
            status.appendChild(s);
          }
        } else {
          const sp = document.getElementById('sp');
          if (sp) sp.remove();
        }
      }

      function openMaps(query, lat, lng) {
        const enc = encodeURIComponent(query);
        if (isIOS) {
          window.location.href = \`https://maps.apple.com/?q=\${enc}&sll=\${lat},\${lng}&z=14\`;
        } else {
          window.location.href = \`https://www.google.com/maps/search/?api=1&query=\${enc}&center=\${lat},\${lng}\`;
        }
      }

      function fallbackMaps(query) {
        const enc = encodeURIComponent(query + ' near Haverfordwest');
        if (isIOS) {
          window.location.href = \`https://maps.apple.com/?q=\${enc}\`;
        } else {
          window.location.href = \`https://www.google.com/maps/search/?api=1&query=\${enc}\`;
        }
      }

      form.addEventListener('submit', e => {
        e.preventDefault();
        const val = q.value.trim();
        if (!val) return;
        showStatus('Getting location…', true);
        btn.disabled = true;

        if (navigator.geolocation) {
          const opts = { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 };
          let done = false;

          navigator.geolocation.getCurrentPosition(pos => {
            if (done) return;
            done = true;
            showStatus('', false);
            openMaps(val, pos.coords.latitude, pos.coords.longitude);
          }, err => {
            if (done) return;
            done = true;
            showStatus('Could not get precise location — opening general search.', false);
            setTimeout(() => fallbackMaps(val), 800);
          }, opts);

          setTimeout(() => {
            if (done) return;
            done = true;
            showStatus('Opening search…', false);
            fallbackMaps(val);
          }, 6500);
        } else {
          fallbackMaps(val);
        }
      });

    })();
  </script>

  <!-- Google Analytics snippet placeholder — replace 'G-XXXXXXXXXX' with your ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</body>
</html>
