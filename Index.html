<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Haverfordwest Local Store Finder</title>
  <meta name="description" content="Find local shops near Haverfordwest based on what you want to buy." />

  <style>
    :root {
      --bg: #f4f7fe;
      --card: #ffffff;
      --accent: #0055a5;
      --muted: #666;
      --radius: 14px;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
      text-align: center;
    }

    /* Simple built-in SVG logo — no external files */
    .logo {
      width: 140px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      color: var(--accent);
    }
    p.lead {
      margin: 0 0 20px;
      font-size: 16px;
      color: var(--muted);
    }
    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      flex: 1 1 auto;
      padding: 14px;
      font-size: 16px;
      border-radius: var(--radius);
      border: 1px solid #ccc;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 18px;
      font-size: 16px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
    }
    #status {
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
      display: none;
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- Self-contained SVG logo -->
  <svg class="logo" viewBox="0 0 300 90">
    <rect width="300" height="90" rx="12" fill="#0055a5"/>
    <text x="20" y="55" font-size="34" fill="white" font-family="sans-serif" font-weight="700">
      Haverfordwest
    </text>
  </svg>

  <h1>Find a Local Store</h1>
  <p class="lead">Type what you want to buy — we’ll show nearby shops around Haverfordwest.</p>

  <form id="form">
    <input id="query" type="search" placeholder="e.g. batteries, pet food, shoes" required>
    <button id="go" type="submit">Search</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const form = document.getElementById("form");
  const query = document.getElementById("query");
  const statusBox = document.getElementById("status");
  const btn = document.getElementById("go");

  function msg(text) {
    statusBox.style.display = "block";
    statusBox.textContent = text;
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  function openMaps(q, lat, lng) {
    const encoded = encodeURIComponent(q);
    if (isIOS) {
      window.location.href = `https://maps.apple.com/?q=${encoded}&sll=${lat},${lng}&z=14`;
    } else {
      window.location.href = `https://www.google.com/maps/search/?api=1&query=${encoded}&center=${lat},${lng}`;
    }
  }

  function fallback(q) {
    const encoded = encodeURIComponent(q + " near Haverfordwest");
    if (isIOS) {
      window.location.href = `https://maps.apple.com/?q=${encoded}`;
    } else {
      window.location.href = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
    }
  }

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const q = query.value.trim();
    btn.disabled = true;
    msg("Getting your location…");

    if (!navigator.geolocation) {
      fallback(q);
      return;
    }

    let done = false;
    navigator.geolocation.getCurrentPosition(
      pos => {
        if (done) return;
        done = true;
        openMaps(q, pos.coords.latitude, pos.coords.longitude);
      },
      err => {
        if (done) return;
        done = true;
        msg("Opening general search…");
        setTimeout(() => fallback(q), 600);
      },
      { timeout: 5000 }
    );

    setTimeout(() => {
      if (done) return;
      done = true;
      msg("Opening search…");
      fallback(q);
    }, 6000);
  });
</script>

</body>
</html>
